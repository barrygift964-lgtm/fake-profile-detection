{% extends 'base.html' %}
{% block title %}Register{% endblock %}
{% block content %}
<section class="split">
  {% include '_hero.html' %}
  <form class="split-form" method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <p class="small-label">Welcome to</p>
    <h1>Fake Profile Detection</h1>
    <input class="field" name="full_name" placeholder="Full Name" value="{{ form.get('full_name', '') }}" required>
    <input class="field" type="email" name="email" placeholder="Email Address" value="{{ form.get('email', '') }}" required>
    <div class="pw"><input class="field" type="password" name="password" placeholder="Password" required>
      <button type="button" class="eye" onclick="togglePw(this)" aria-label="Show password">&#128065;</button></div>
    <div class="pw"><input class="field" type="password" name="confirm_password" placeholder="Confirm Password" required>
      <button type="button" class="eye" onclick="togglePw(this)" aria-label="Show password">&#128065;</button></div>
    <label class="check"><input type="checkbox" name="keep_signed_in"> Keep me signed in</label>
    <button class="btn wide" type="submit">Register</button>
    <p class="center muted">Already have an account? <a class="strong" href="{{ url_for('login') }}">Login</a></p>
  </form>
</section>
<script>function togglePw(b){const i=b.previousElementSibling;i.type=i.type==='password'?'text':'password';}</script>
{% endblock %}
